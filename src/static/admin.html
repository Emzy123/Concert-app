<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Light of Life Concert - Admin Panel</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>🎵 Light of Life Concert - Admin Panel</h1>
            <nav>
                <button onclick="showSection(\'managePhotosSection\')">🖼️ Manage Photos</button>
                <button onclick="showSection(\'categoriesSection\')">🗂️ Categories</button>
                <button onclick="showSection(\'uploadPhotosSection\')">📤 Upload Photos</button>
                <button onclick="showSection(\'ministersSection\')">🎤 Ministers</button>
                <button onclick="showSection(\'aboutSection\')">ℹ️ About</button>
                <button onclick="showSection(\'scheduleSection\')">🗓️ Schedule</button>
                <button onclick="showSection(\'rsvpsSection\')">🎟️ RSVPs</button>
                <button onclick="window.location.href=\'login.html\'">🚪 Logout</button>
            </nav>
        </div>
    </header>

    <main class="container">
        <!-- Manage Photos Section -->
        <section id="managePhotosSection" class="admin-section">
            <h2>🖼️ Manage Photos</h2>
            <div class="photo-grid" id="photoGrid">
                <!-- Photos will be loaded here by JavaScript -->
            </div>
        </section>

        <!-- Categories Section -->
        <section id="categoriesSection" class="admin-section" style="display: none;">
            <h2>🗂️ Categories</h2>
            <form id="addCategoryForm" class="admin-form">
                <div class="form-group">
                    <label for="categoryName">Category Name:</label>
                    <input type="text" id="categoryName" name="name" required placeholder="e.g., Youth Ministry">
                </div>
                <div class="form-group">
                    <label for="categoryDescription">Description:</label>
                    <textarea id="categoryDescription" name="description" rows="2" placeholder="Brief description of this category"></textarea>
                </div>
                <div class="form-group">
                    <label for="categoryOrder">Display Order:</label>
                    <input type="number" id="categoryOrder" name="display_order" value="0" min="0">
                </div>
                <button type="submit" class="btn btn--primary">💾 Create Category</button>
            </form>
            <h3>Existing Categories</h3>
            <div class="list-container" id="categoriesList">
                <!-- Categories will be loaded here by JavaScript -->
            </div>
        </section>

        <!-- Upload Photos Section -->
        <section id="uploadPhotosSection" class="admin-section" style="display: none;">
            <h2>📤 Upload Photos</h2>
            <form id="uploadForm" class="admin-form">
                <div class="form-group">
                    <label for="photoTitle">Title:</label>
                    <input type="text" id="photoTitle" name="title" required>
                </div>
                <div class="form-group">
                    <label for="photoDescription">Description:</label>
                    <textarea id="photoDescription" name="description" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label for="photoCategory">Category:</label>
                    <select id="photoCategory" name="category_id" required>
                        <!-- Categories will be loaded here -->
                    </select>
                </div>
                <div class="form-group">
                    <label for="photoUrl">Image URL:</label>
                    <input type="url" id="photoUrl" name="image_url" placeholder="https://example.com/image.jpg" required>
                </div>
                <div class="form-group">
                    <label for="photoAltText">Alt Text:</label>
                    <input type="text" id="photoAltText" name="alt_text">
                </div>
                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="isFeatured" name="is_featured">
                        <span class="checkmark"></span>
                        Featured Photo
                    </label>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn--primary">📤 Upload Photo</button>
                    <button type="button" id="cancelUpload" class="btn btn--secondary">❌ Cancel</button>
                </div>
            </form>
            <div class="upload-progress" id="uploadProgress" style="display: none;">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <p id="progressText">Uploading...</p>
            </div>
        </section>

        <!-- Ministers Section -->
        <section id="ministersSection" class="admin-section" style="display: none;">
            <h2>🎤 Guest Ministers</h2>
            <form id="ministerForm" class="admin-form">
                <div class="form-group">
                    <label for="ministerName">Name:</label>
                    <input type="text" id="ministerName" name="name" required>
                </div>
                <div class="form-group">
                    <label for="ministerDescription">Description:</label>
                    <textarea id="ministerDescription" name="description" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label for="ministerPhotoUrl">Photo URL:</label>
                    <input type="url" id="ministerPhotoUrl" name="photo_url" placeholder="https://example.com/minister.jpg">
                </div>
                <button type="submit" class="btn btn--primary">➕ Add Minister</button>
            </form>
            <h3>Existing Ministers</h3>
            <div class="list-container" id="ministersList">
                <!-- Ministers will be loaded here by JavaScript -->
            </div>
        </section>

        <!-- About Section -->
        <section id="aboutSection" class="admin-section" style="display: none;">
            <h2>ℹ️ About Page Content</h2>
            <form id="aboutForm" class="admin-form">
                <div class="form-group">
                    <label for="aboutTitle">Title:</label>
                    <input type="text" id="aboutTitle" name="title" required>
                </div>
                <div class="form-group">
                    <label for="aboutContent">Content:</label>
                    <textarea id="aboutContent" name="content" rows="10"></textarea>
                </div>
                <div class="form-group">
                    <label for="aboutImageUrl">Image URL:</label>
                    <input type="url" id="aboutImageUrl" name="image_url" placeholder="https://example.com/about.jpg">
                </div>
                <button type="submit" class="btn btn--primary">💾 Update About Page</button>
            </form>
        </section>

        <!-- Schedule Section -->
        <section id="scheduleSection" class="admin-section" style="display: none;">
            <h2>🗓️ Schedule Management</h2>
            <form id="scheduleForm" class="admin-form">
                <div class="form-group">
                    <label for="eventTime">Time:</label>
                    <input type="text" id="eventTime" name="time" required placeholder="e.g., 3:00 PM">
                </div>
                <div class="form-group">
                    <label for="eventTitle">Title:</label>
                    <input type="text" id="eventTitle" name="title" required placeholder="e.g., Doors Open">
                </div>
                <div class="form-group">
                    <label for="eventDescription">Description:</label>
                    <textarea id="eventDescription" name="description" rows="2" placeholder="e.g., Registration and welcome"></textarea>
                </div>
                <div class="form-group">
                    <label for="eventOrder">Display Order:</label>
                    <input type="number" id="eventOrder" name="display_order" value="0" min="0">
                </div>
                <button type="submit" class="btn btn--primary">➕ Add Event</button>
            </form>
            <h3>Current Schedule</h3>
            <div class="list-container" id="scheduleList">
                <!-- Schedule will be loaded here by JavaScript -->
            </div>
        </section>

        <!-- RSVPs Section -->
        <section id="rsvpsSection" class="admin-section" style="display: none;">
            <h2>🎟️ RSVPs</h2>
            <div class="list-container" id="rsvpsList">
                <!-- RSVPs will be loaded here by JavaScript -->
            </div>
        </section>
    </main>

    <!-- Photo Edit Modal -->
    <div id="editPhotoModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>✏️ Edit Photo</h3>
                <button class="modal-close" id="closeEditModal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="edit-photo-preview" id="editPhotoPreview"></div>
                <form id="editPhotoForm">
                    <div class="form-group">
                        <label for="editTitle">Title:</label>
                        <input type="text" id="editTitle" name="title" required>
                    </div>
                    <div class="form-group">
                        <label for="editDescription">Description:</label>
                        <textarea id="editDescription" name="description" rows="3"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="editCategory">Category:</label>
                        <select id="editCategory" name="category_id" required></select>
                    </div>
                    <div class="form-group">
                        <label for="editAltText">Alt Text:</label>
                        <input type="text" id="editAltText" name="alt_text">
                    </div>
                    <div class="form-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="editIsFeatured" name="is_featured">
                            <span class="checkmark"></span>
                            Featured Photo
                        </label>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" id="savePhotoChanges" class="btn btn--primary">💾 Save Changes</button>
                <button type="button" id="deletePhoto" class="btn btn--danger">🗑️ Delete Photo</button>
            </div>
        </div>
    </div>

    <!-- Add Category Modal -->
    <div id="addCategoryModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>➕ Add New Category</h3>
                <button class="modal-close" id="closeAddCategoryModal">&times;</button>
            </div>
            <div class="modal-body">
                <form id="addCategoryForm">
                    <div class="form-group">
                        <label for="categoryName">Category Name:</label>
                        <input type="text" id="categoryName" name="name" required placeholder="e.g., Youth Ministry">
                    </div>
                    <div class="form-group">
                        <label for="categoryDescription">Description:</label>
                        <textarea id="categoryDescription" name="description" rows="2" placeholder="Brief description of this category"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="categoryOrder">Display Order:</label>
                        <input type="number" id="categoryOrder" name="display_order" value="0" min="0">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" id="saveCategoryBtn" class="btn btn--primary">💾 Create Category</button>
            </div>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- Scripts -->
    <script>
(async function ensureAdmin(){
  try{
    const res = await fetch(\'/api/auth/status\');
    const data = await res.json();
    if (!data.authenticated || !data.user?.is_admin) {
      window.location.href = \'login.html\';
    }
  }catch(e){
    window.location.href = \'login.html\';
  }
})();
</script>

    <script src="animations.js"></script>
    <script src="admin.js"></script>
</body>
</html>
